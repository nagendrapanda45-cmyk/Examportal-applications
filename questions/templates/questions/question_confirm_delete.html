{% extends "layouts/base.html" %}
{% block title %} Delete Question {% endblock %}
{% block content %}
<div class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header card-header-primary">
                        <h4 class="card-title">Delete Question</h4>
                        <p class="card-category">Are you sure you want to delete this question?</p>
                    </div>
                    <div class="card-body">
                        <h5>Question ID: {{ question.question_id }}</h5>
                        <p>{{ question.question_text|truncatechars:100 }}</p>
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn bg-gradient-dark">Confirm Delete</button>
                            <a href="{% url 'question_list' %}" class="btn bg-gradient-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

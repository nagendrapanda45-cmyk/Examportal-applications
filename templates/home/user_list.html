{% extends 'layouts/base.html' %} {% block content %}
<div class="container mt-5">
  <h2>User List</h2>
  <a href="{% url 'user_create' %}" class="btn btn-success mb-3"
    >+ Add New Profile</a
  >
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Reg ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.registration_id }}</td>
        <td>{{ user.full_name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.mobile }}</td>
        <td>
          <a href="{% url 'user_edit' user.pk %}" class="btn btn-sm btn-warning"
            >Edit</a
          >
          <a
            href="{% url 'user_delete' user.pk %}"
            class="btn btn-sm btn-danger"
            >Delete</a
          >
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
